[project]
name = "wallet-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "max-dv800", email = "m.dvornikov86@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.1.1",
    "aiodocker>=0.27.0",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "black>=26.10.1",
    "celery>=5.6.3",
    "celery-types>=0.26.0",
    "fastapi>=0.143.0",
    "httpie>=3.2.4",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-dotenv>=0.5.2",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "ruff>=0.17.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
wallet-api = "wallet_api:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

